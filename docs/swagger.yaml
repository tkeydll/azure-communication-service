openapi: 3.0.3
info:
  title: Azure Communication Services - Call API
  description: Azure Communication Services を使用して PSTN 電話をかけ、音声メッセージを再生する API
  version: 1.0.0

servers:
  - url: http://localhost:7071/api
    description: ローカル開発環境
  - url: https://jns-communication-service-function-3.azurewebsites.net/api
    description: Azure 本番環境

security:
  - functionKey: []

paths:
  /CallWebhook:
    post:
      summary: 電話発信
      description: |
        指定した電話番号への PSTN 発信を開始します。通話接続、音声再生、切断は
        Call Automation callback (`/CallEvents`) で非同期に処理されます。
      operationId: callWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallWebhookRequest'
            examples:
              full:
                summary: すべてのパラメータを指定
                value:
                  toPhoneNumber: "+819012345678"
                  audioUrl: "https://example.com/audio.wav"
              minimal:
                summary: 最小限（環境変数 TO_PHONE_NUMBER 設定済みの場合）
                value: {}
              phoneOnly:
                summary: 電話番号のみ指定
                value:
                  toPhoneNumber: "+819012345678"
      responses:
        "202":
          description: 通話の開始要求を受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallWebhookSuccessResponse'
        "400":
          description: リクエストパラメータが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "toPhoneNumber is required"
        "500":
          description: 通話処理中にエラーが発生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFailedResponse'
              example:
                error: "Failed to make call"
                details: "Connection timeout"

  /CallEvents:
    post:
      summary: Call Automation イベント callback
      description: |
        Azure Communication Services が通話状態の変化を通知する callback です。
        `CallConnected` で音声再生を開始し、`PlayCompleted` または `PlayFailed` で通話を切断します。
        クライアントが直接呼び出す発信用 API ではありません。
      operationId: callEvents
      parameters:
        - name: audioUrl
          in: query
          required: false
          description: CallConnected 時に再生する音声 URL。省略時は Function App の設定から解決します。
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CallAutomationEvent'
                - type: array
                  items:
                    $ref: '#/components/schemas/CallAutomationEvent'
      responses:
        "200":
          description: イベントを受信して処理した
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "500":
          description: イベント処理に失敗した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFailedResponse'

  /GetAudio:
    get:
      summary: 音声ファイル取得
      description: `functions/public/message.mp3` を `audio/mpeg` として返します。CallEvents が CallConnected 後の音声再生で使用します。
      operationId: getAudio
      responses:
        "200":
          description: 音声ファイル
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=3600"
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: 音声ファイルが見つからない
          content:
            text/plain:
              schema:
                type: string
                example: "Audio file not found"
        "500":
          description: サーバーエラー
          content:
            text/plain:
              schema:
                type: string
                example: "Error: ENOENT: no such file or directory"

components:
  schemas:
    CallWebhookRequest:
      type: object
      properties:
        toPhoneNumber:
          type: string
          description: |
            発信先の電話番号（E.164 形式）。
            省略時は環境変数 TO_PHONE_NUMBER が使用されます。どちらも未設定の場合は 400 エラー。
          example: "+819012345678"
        audioUrl:
          type: string
          format: uri
          description: |
            再生する音声ファイルの URL。WAV (mono, 16KHz) 推奨。
            省略時は環境変数 AUDIO_FILE_URL → デフォルト URL の順でフォールバック。
          example: "https://example.com/message.wav"

    CallWebhookSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        callConnectionId:
          type: string
          description: 通話接続 ID
          example: "411f0200-c4d6-4c42-9e40-b0f2284d5400"
        from:
          type: string
          description: 発信元電話番号
          example: "+815000000000"
        to:
          type: string
          description: 発信先電話番号
          example: "+819012345678"
        message:
          type: string
          description: 発信受付と、音声再生を CallEvents に委譲したことを示すメッセージ
          example: "Call initiated; playback will be controlled by CallEvents"
        audioUrl:
          type: string
          format: uri
          description: 再生された音声ファイルの URL
          example: "https://example.com/message.wav"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CallFailedResponse:
      type: object
      properties:
        error:
          type: string
          example: "Failed to make call"
        details:
          type: string
          description: エラーの詳細メッセージ
      required:
        - error
        - details

    CallAutomationEvent:
      type: object
      description: Azure Communication Services Call Automation が送信するイベントの最小形式
      properties:
        type:
          type: string
          description: イベント種別
          enum:
            - Microsoft.Communication.CallConnected
            - Microsoft.Communication.PlayCompleted
            - Microsoft.Communication.PlayFailed
            - Microsoft.Communication.CallDisconnected
        data:
          type: object
          properties:
            callConnectionId:
              type: string
              description: 操作対象の通話接続 ID
            operationContext:
              type: string
            resultInformation:
              description: 音声再生失敗時などの結果情報
              nullable: true
          additionalProperties: true
      required:
        - type

  securitySchemes:
    functionKey:
      type: apiKey
      in: query
      name: code
      description: Azure Functions の Function Key
